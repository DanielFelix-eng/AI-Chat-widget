services:
  - type: web
    name: ai-chat-widget
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: AI Chat
